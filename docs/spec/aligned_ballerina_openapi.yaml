openapi: 3.0.3
info:
  title: Spotify Web API
  description: 'Client for the Spotify Web API. Search the Spotify catalog, manage a user''s library and
    playlists, follow artists and users, and control playback on a user''s devices. Requests need an OAuth
    2.0 access token.

    '
  termsOfService: https://developer.spotify.com/terms/
  contact:
    name: Spotify for Developers Community
    url: https://community.spotify.com/t5/Spotify-for-Developers/bd-p/Spotify_Developer
  version: 1.0.0
servers:
- url: https://api.spotify.com/v1
tags:
- name: Albums
- name: Artists
- name: Audiobooks
- name: Categories
- name: Chapters
- name: Episodes
- name: Library
- name: Genres
- name: Markets
- name: Player
- name: Playlists
- name: Search
- name: Shows
- name: Tracks
- name: Users
paths:
  /albums/{id}:
    get:
      tags:
      - Albums
      summary: 'Get Album

        '
      description: 'Get Spotify catalog information for a single album.

        '
      operationId: getAlbum
      parameters:
      - $ref: '#/components/parameters/PathAlbumId'
      - $ref: '#/components/parameters/QueryMarket'
      responses:
        '200':
          $ref: '#/components/responses/OneAlbum'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
  /albums/{id}/tracks:
    get:
      tags:
      - Albums
      - Tracks
      summary: 'Get Album Tracks

        '
      description: 'Get Spotify catalog information about an album’s tracks.

        Optional parameters can be used to limit the number of tracks returned.

        '
      operationId: listAlbumTracks
      parameters:
      - $ref: '#/components/parameters/PathAlbumId'
      - $ref: '#/components/parameters/QueryMarket'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QueryOffset'
      responses:
        '200':
          $ref: '#/components/responses/PagingSimplifiedTrackObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
  /artists/{id}:
    get:
      tags:
      - Artists
      summary: 'Get Artist

        '
      description: 'Get Spotify catalog information for a single artist identified by their unique Spotify
        ID.

        '
      operationId: getArtist
      parameters:
      - $ref: '#/components/parameters/PathArtistId'
      responses:
        '200':
          $ref: '#/components/responses/OneArtist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
  /artists/{id}/albums:
    get:
      tags:
      - Artists
      - Albums
      summary: 'Get Artist''s Albums

        '
      description: 'Get Spotify catalog information about an artist''s albums.

        '
      operationId: listArtistAlbums
      parameters:
      - $ref: '#/components/parameters/PathArtistId'
      - $ref: '#/components/parameters/QueryIncludeGroups'
      - $ref: '#/components/parameters/QueryMarket'
      - name: limit
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Limit
          maximum: 10
          minimum: 0
          type: integer
          description: 'The maximum number of items to return. Default: 5. Minimum: 1. Maximum: 10.

            '
          example: 5
          default: 5
      - $ref: '#/components/parameters/QueryOffset'
      responses:
        '200':
          $ref: '#/components/responses/PagingArtistDiscographyAlbumObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
  /shows/{id}:
    get:
      tags:
      - Shows
      summary: 'Get Show

        '
      description: 'Get Spotify catalog information for a single show identified by its

        unique Spotify ID.

        '
      operationId: getShow
      parameters:
      - $ref: '#/components/parameters/QueryMarket'
      - $ref: '#/components/parameters/PathShowId'
      responses:
        '200':
          $ref: '#/components/responses/OneShow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - user-read-playback-position
  /shows/{id}/episodes:
    get:
      tags:
      - Shows
      - Episodes
      summary: 'Get Show Episodes

        '
      description: 'Get Spotify catalog information about an show’s episodes. Optional parameters can
        be used to limit the number of episodes returned.

        '
      operationId: listShowEpisodes
      parameters:
      - $ref: '#/components/parameters/PathShowId'
      - $ref: '#/components/parameters/QueryMarket'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QueryOffset'
      responses:
        '200':
          $ref: '#/components/responses/PagingSimplifiedEpisodeObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - user-read-playback-position
  /episodes/{id}:
    get:
      tags:
      - Episodes
      summary: 'Get Episode

        '
      description: 'Get Spotify catalog information for a single episode identified by its

        unique Spotify ID.

        '
      operationId: getEpisode
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          title: Get an Episode
          type: string
          description: The [Spotify ID](/documentation/web-api/concepts/spotify-uris-ids) for the episode.
          example: 512ojhOuo1ktJprKbVcKyQ
      - $ref: '#/components/parameters/QueryMarket'
      responses:
        '200':
          $ref: '#/components/responses/OneEpisode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - user-read-playback-position
  /audiobooks/{id}:
    get:
      tags:
      - Audiobooks
      summary: 'Get an Audiobook

        '
      description: 'Get Spotify catalog information for a single audiobook. Audiobooks are only available
        within the US, UK, Canada, Ireland, New Zealand and Australia markets.

        '
      operationId: getAudiobook
      parameters:
      - $ref: '#/components/parameters/PathAudiobookId'
      - $ref: '#/components/parameters/QueryMarket'
      responses:
        '200':
          $ref: '#/components/responses/OneAudiobook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
  /audiobooks/{id}/chapters:
    get:
      tags:
      - Audiobooks
      - Chapters
      summary: 'Get Audiobook Chapters

        '
      description: 'Get Spotify catalog information about an audiobook''s chapters. Audiobooks are only
        available within the US, UK, Canada, Ireland, New Zealand and Australia markets.

        '
      operationId: listAudiobookChapters
      parameters:
      - $ref: '#/components/parameters/PathAudiobookId'
      - $ref: '#/components/parameters/QueryMarket'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QueryOffset'
      responses:
        '200':
          $ref: '#/components/responses/PagingSimplifiedChapterObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
  /me/audiobooks:
    get:
      tags:
      - Audiobooks
      - Library
      summary: 'Get User''s Saved Audiobooks

        '
      description: 'Get a list of the audiobooks saved in the current Spotify user''s ''Your Music'' library.

        '
      operationId: listSavedAudiobooks
      parameters:
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QueryOffset'
      responses:
        '200':
          $ref: '#/components/responses/PagingSimplifiedAudiobookObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - user-library-read
  /chapters/{id}:
    get:
      tags:
      - Chapters
      summary: 'Get a Chapter

        '
      description: 'Get Spotify catalog information for a single audiobook chapter. Chapters are only
        available within the US, UK, Canada, Ireland, New Zealand and Australia markets.

        '
      operationId: getChapter
      parameters:
      - $ref: '#/components/parameters/PathChapterId'
      - $ref: '#/components/parameters/QueryMarket'
      responses:
        '200':
          $ref: '#/components/responses/OneChapter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
  /tracks/{id}:
    get:
      tags:
      - Tracks
      summary: 'Get Track

        '
      description: 'Get Spotify catalog information for a single track identified by its

        unique Spotify ID.

        '
      operationId: getTrack
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          title: Spotify Track ID
          type: string
          description: 'The [Spotify ID](/documentation/web-api/concepts/spotify-uris-ids)

            for the track.

            '
          example: 11dFghVXANMlKmJXsNCbNl
      - $ref: '#/components/parameters/QueryMarket'
      responses:
        '200':
          $ref: '#/components/responses/OneTrack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
  /search:
    get:
      tags:
      - Search
      summary: 'Search for Item

        '
      description: 'Get Spotify catalog information about albums, artists, playlists, tracks, shows, episodes
        or audiobooks

        that match a keyword string. Audiobooks are only available within the US, UK, Canada, Ireland,
        New Zealand and Australia markets.

        '
      operationId: searchItems
      parameters:
      - name: q
        in: query
        required: true
        style: form
        explode: true
        schema:
          title: Query
          type: string
          description: 'Your search query.


            You can narrow down your search using field filters. The available filters are `album`, `artist`,
            `track`, `year`, `upc`, `tag:hipster`, `tag:new`, `isrc`, and `genre`. Each field filter only
            applies to certain result types.


            The `artist` and `year` filters can be used while searching albums, artists and tracks. You
            can filter on a single `year` or a range (e.g. 1955-1960).<br />

            The `album` filter can be used while searching albums and tracks.<br />

            The `genre` filter can be used while searching artists and tracks.<br />

            The `isrc` and `track` filters can be used while searching tracks.<br />

            The `upc`, `tag:new` and `tag:hipster` filters can only be used while searching albums. The
            `tag:new` filter will return albums released in the past two weeks and `tag:hipster` can be
            used to return only albums with the lowest 10% popularity.<br />

            '
          example: remaster%20track:Doxy%20artist:Miles%20Davis
      - name: type
        in: query
        required: true
        style: form
        explode: false
        schema:
          title: Item type
          type: array
          description: 'A comma-separated list of item types to search across. Search results include
            hits

            from all the specified item types. For example: `q=abacab&type=album,track` returns

            both albums and tracks matching "abacab".

            '
          items:
            type: string
            enum:
            - album
            - artist
            - playlist
            - track
            - show
            - episode
            - audiobook
      - $ref: '#/components/parameters/QueryMarket'
      - name: limit
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Limit
          maximum: 10
          minimum: 0
          type: integer
          description: 'The maximum number of results to return in each item type.

            '
          example: 10
          default: 5
      - name: offset
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Offset
          maximum: 1000
          minimum: 0
          type: integer
          description: 'The index of the first result to return. Use

            with limit to get the next page of search results.

            '
          example: 5
          default: 0
      - name: include_external
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Include External
          type: string
          description: 'If `include_external=audio` is specified it signals that the client can play externally
            hosted audio content, and marks

            the content as playable in the response. By default externally hosted audio content is marked
            as unplayable in the response.

            '
          enum:
          - audio
        x-ballerina-name: includeExternal
      responses:
        '200':
          $ref: '#/components/responses/SearchItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
  /me:
    get:
      tags:
      - Users
      summary: 'Get Current User''s Profile

        '
      description: 'Get detailed profile information about the current user (including the

        current user''s username).

        '
      operationId: getCurrentUserProfile
      responses:
        '200':
          $ref: '#/components/responses/OnePrivateUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - user-read-private
        - user-read-email
  /playlists/{playlistId}:
    get:
      tags:
      - Playlists
      summary: 'Get Playlist

        '
      description: 'Get a playlist owned by a Spotify user.

        '
      operationId: getPlaylist
      parameters:
      - $ref: '#/components/parameters/PathPlaylistId'
      - $ref: '#/components/parameters/QueryMarket'
      - name: fields
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Fields
          type: string
          description: 'Filters for the query: a comma-separated list of the

            fields to return. If omitted, all fields are returned. For example, to get

            just the playlist''''s description and URI: `fields=description,uri`. A dot

            separator can be used to specify non-reoccurring fields, while parentheses

            can be used to specify reoccurring fields within objects. For example, to

            get just the added date and user ID of the adder: `fields=tracks.items(added_at,added_by.id)`.

            Use multiple parentheses to drill down into nested objects, for example: `fields=tracks.items(track(name,href,album(name,href)))`.

            Fields can be excluded by prefixing them with an exclamation mark, for example:

            `fields=tracks.items(track(name,href,album(!name,href)))`

            '
          example: items(added_by.id,track(name,href,album(name,href)))
      - $ref: '#/components/parameters/QueryAdditionalTypes'
      responses:
        '200':
          $ref: '#/components/responses/OnePlaylist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0: []
    put:
      tags:
      - Playlists
      - Library
      summary: 'Change Playlist Details

        '
      description: 'Change a playlist''s name and public/private state. (The user must, of

        course, own the playlist.)

        '
      operationId: updatePlaylistDetails
      parameters:
      - $ref: '#/components/parameters/PathPlaylistId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistDetailsRequest'
        description: Playlist name, description, and visibility details to change
      responses:
        '200':
          description: Playlist updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - playlist-modify-public
        - playlist-modify-private
  /playlists/{playlistId}/items:
    get:
      tags:
      - Playlists
      - Tracks
      summary: 'Get Playlist Items

        '
      description: 'Get full details of the items of a playlist owned by a Spotify user.


        **Note**: This endpoint is only accessible for playlists owned by the current user or playlists
        the user is a collaborator of. A `403 Forbidden` status code will be returned if the user is neither
        the owner nor a collaborator of the playlist.

        '
      operationId: listPlaylistItems
      parameters:
      - $ref: '#/components/parameters/PathPlaylistId'
      - $ref: '#/components/parameters/QueryMarket'
      - name: fields
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Fields
          type: string
          description: 'Filters for the query: a comma-separated list of the

            fields to return. If omitted, all fields are returned. For example, to get

            just the total number of items and the request limit:<br/>`fields=total,limit`<br/>A

            dot separator can be used to specify non-reoccurring fields, while parentheses

            can be used to specify reoccurring fields within objects. For example, to

            get just the added date and user ID of the adder:<br/>`fields=items(added_at,added_by.id)`<br/>Use

            multiple parentheses to drill down into nested objects, for example:<br/>`fields=items(track(name,href,album(name,href)))`<br/>Fields

            can be excluded by prefixing them with an exclamation mark, for example:<br/>`fields=items.track.album(!external_urls,images)`

            '
          example: items(added_by.id,track(name,href,album(name,href)))
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QueryOffset'
      - $ref: '#/components/parameters/QueryAdditionalTypes'
      responses:
        '200':
          $ref: '#/components/responses/PagingPlaylistTrackObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - playlist-read-private
    put:
      tags:
      - Playlists
      - Tracks
      summary: 'Update Playlist Items

        '
      description: 'Either reorder or replace items in a playlist depending on the request''s parameters.

        To reorder items, include `range_start`, `insert_before`, `range_length` and `snapshot_id` in
        the request''s body.

        To replace items, include `uris` as either a query parameter or in the request''s body.

        Replacing items in a playlist will overwrite its existing items. This operation can be used for
        replacing or clearing items in a playlist.

        <br/>

        **Note**: Replace and reorder are mutually exclusive operations which share the same endpoint,
        but have different parameters.

        These operations can''t be applied together in a single request.

        '
      operationId: updatePlaylistItems
      parameters:
      - $ref: '#/components/parameters/PathPlaylistId'
      - name: uris
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Spotify Track URIs
          type: string
          description: 'A comma-separated list of [Spotify URIs](/documentation/web-api/concepts/spotify-uris-ids)
            to set, can be track or episode URIs. For example: `uris=spotify:track:4iV5W9uYEdYUVa79Axb7Rh,spotify:track:1301WleyT98MSxVHPZCA6M,spotify:episode:512ojhOuo1ktJprKbVcKyQ`<br/>A
            maximum of 100 items can be set in one request.

            '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistItemsRequest'
        description: URIs to replace the playlist items, or range to reorder
      responses:
        '200':
          $ref: '#/components/responses/PlaylistSnapshotId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - playlist-modify-public
        - playlist-modify-private
    post:
      tags:
      - Playlists
      - Tracks
      summary: 'Add Items to Playlist

        '
      description: 'Add one or more items to a user''s playlist.

        '
      operationId: addItemsToPlaylist
      parameters:
      - $ref: '#/components/parameters/PathPlaylistId'
      - name: position
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Position (append by default)
          type: integer
          description: 'The position to insert the items, a zero-based index. For example, to insert the
            items in the first position: `position=0`; to insert the items in the third position: `position=2`.
            If omitted, the items will be appended to the playlist. Items are added in the order they
            are listed in the query string or request body.

            '
          example: 0
      - name: uris
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Spotify Track URIs
          type: string
          description: 'A comma-separated list of [Spotify URIs](/documentation/web-api/concepts/spotify-uris-ids)
            to add, can be track or episode URIs. For example:<br/>`uris=spotify:track:4iV5W9uYEdYUVa79Axb7Rh,
            spotify:track:1301WleyT98MSxVHPZCA6M, spotify:episode:512ojhOuo1ktJprKbVcKyQ`<br/>A maximum
            of 100 items can be added in one request. <br/>

            _**Note**: it is likely that passing a large number of item URIs as a query parameter will
            exceed the maximum length of the request URI. When adding a large number of items, it is recommended
            to pass them in the request body, see below._

            '
          example: spotify:track:4iV5W9uYEdYUVa79Axb7Rh,spotify:track:1301WleyT98MSxVHPZCA6M
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemsToPlaylistRequest'
        description: Item URIs and optional position to add to the playlist
      responses:
        '201':
          $ref: '#/components/responses/PlaylistSnapshotId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - playlist-modify-public
        - playlist-modify-private
    delete:
      tags:
      - Playlists
      - Tracks
      summary: 'Remove Playlist Items

        '
      description: 'Remove one or more items from a user''s playlist.

        '
      operationId: removePlaylistItems
      parameters:
      - $ref: '#/components/parameters/PathPlaylistId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemovePlaylistItemsRequest'
        description: Item URIs to remove from the playlist
      responses:
        '200':
          $ref: '#/components/responses/PlaylistSnapshotId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - oauth_2_0:
        - playlist-modify-public
