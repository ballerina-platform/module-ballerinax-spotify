      operationId: set-volume-for-users-playback
      parameters:
      - name: volume_percent
        in: query
        required: true
        style: form
        explode: true
        schema:
          title: Volume %
          type: integer
          description: |
            The volume to set. Must be a value from 0 to 100 inclusive.
          example: 50
      - name: device_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Device ID
          type: string
          description: |
            The id of the device this command is targeting. If not supplied, the user's currently active device is the target.
          example: 0d1841b0976bae2a3a310dd74c0f3df354899bc8
      responses:
        "204":
          description: Command sent
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security:
      - oauth_2_0:
        - user-modify-playback-state
  /me/player/shuffle:
    put:
      tags:
      - Player
      summary: |
        Toggle Playback Shuffle
      description: |
        Toggle shuffle on or off for user’s playback. This API only works for users who have Spotify Premium. The order of execution is not guaranteed when you use this API with other Player API endpoints.
      operationId: toggle-shuffle-for-users-playback
      parameters:
      - name: state
        in: query
        required: true
        style: form
        explode: true
        schema:
          title: State
          type: boolean
          description: |
            **true** : Shuffle user's playback.<br/>
            **false** : Do not shuffle user's playback.
          example: true
      - name: device_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Device ID
          type: string
          description: |
            The id of the device this command is targeting. If
            not supplied, the user's currently active device is the target.
          example: 0d1841b0976bae2a3a310dd74c0f3df354899bc8
      responses:
        "204":
          description: Command sent
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security:
      - oauth_2_0:
        - user-modify-playback-state
  /me/player/recently-played:
    get:
      tags:
      - Player
      summary: |
        Get Recently Played Tracks
      description: |
        Get tracks from the current user's recently played tracks.
        _**Note**: Currently doesn't support podcast episodes._
      operationId: get-recently-played
      parameters:
      - name: limit
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Limit
          maximum: 50
          minimum: 0
          type: integer
          description: |
            The maximum number of items to return. Default: 20. Minimum: 1. Maximum: 50.
          example: 10
          default: 20
      - name: after
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: After
          type: integer
          description: |
            A Unix timestamp in milliseconds. Returns all items
            after (but not including) this cursor position. If `after` is specified, `before`
            must not be specified.
          example: 1484811043508
      - name: before
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Before
          type: integer
          description: |
            A Unix timestamp in milliseconds. Returns all items
            before (but not including) this cursor position. If `before` is specified,
            `after` must not be specified.
      responses:
        "200":
          $ref: "#/components/responses/CursorPagedPlayHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security:
      - oauth_2_0:
        - user-read-recently-played
  /me/player/queue:
    get:
      tags:
      - Player
      summary: |
        Get the User's Queue
      description: |
        Get the list of objects that make up the user's queue.
      operationId: get-queue
      responses:
        "200":
          $ref: "#/components/responses/Queue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security:
      - oauth_2_0:
        - user-read-currently-playing
        - user-read-playback-state
    post:
      tags:
      - Player
      summary: |
        Add Item to Playback Queue
      description: |
        Add an item to be played next in the user's current playback queue. This API only works for users who have Spotify Premium. The order of execution is not guaranteed when you use this API with other Player API endpoints.
      operationId: add-to-queue
      parameters:
      - name: uri
        in: query
        required: true
        style: form
        explode: true
        schema:
          title: Spotify URI
          type: string
          description: |
            The uri of the item to add to the queue. Must be a track or an episode uri.
          example: spotify:track:4iV5W9uYEdYUVa79Axb7Rh
      - name: device_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          title: Device ID
          type: string
          description: |
            The id of the device this command is targeting. If
            not supplied, the user's currently active device is the target.
          example: 0d1841b0976bae2a3a310dd74c0f3df354899bc8
      responses:
        "204":
          description: Command received
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security:
      - oauth_2_0:
        - user-modify-playback-state
components:
