            - `spotify:show:{id}`
            - `spotify:audiobook:{id}`
            - `spotify:user:{id}`
            - `spotify:playlist:{id}`
          example: "spotify:track:7a3LWj5xSFhFRYmztS8wgK,spotify:album:4aawyAB9vmqN3uQ7FjRGTy"
      responses:
